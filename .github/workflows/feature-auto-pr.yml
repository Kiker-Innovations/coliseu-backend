name: Auto Create PR to Develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to Develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "📌 Branch: $BRANCH_NAME"

      - name: Check if develop exists
        id: check-develop
        run: |
          if git ls-remote --heads origin develop | grep -q develop; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Branch develop exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Branch develop does not exist"
          fi

      - name: Check for existing PR
        if: steps.check-develop.outputs.exists == 'true'
        id: check-pr
        run: |
          EXISTING_PR=$(gh pr list --head "${{ steps.branch.outputs.name }}" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "ℹ️ PR #$EXISTING_PR já está aberta. Ignorando criação de nova PR."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📝 No existing open PR found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.check-develop.outputs.exists == 'true' && steps.check-pr.outputs.exists != 'true'
        id: create-pr
        run: |
          PR_URL=$(gh pr create \
            --head "${{ steps.branch.outputs.name }}" \
            --base develop \
            --title "🔀 ${{ steps.branch.outputs.name }} → develop" \
            --body "## 🚀 Pull Request

          This PR was automatically created when the branch \`${{ steps.branch.outputs.name }}\` was pushed.

          ### ℹ️ Details
          - **Source Branch:** \`${{ steps.branch.outputs.name }}\`
          - **Target Branch:** \`develop\`
          - **Commit:** ${{ github.sha }}
          - **Author:** @${{ github.actor }}

          ---
          _Please review and merge manually._")
          
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "✅ PR created: $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 📋 PR Creation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source Branch | \`${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Branch | \`develop\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.create-pr.outputs.url }}" ]; then
            echo "| PR URL | ${{ steps.create-pr.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ Created |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check-pr.outputs.exists }}" == "true" ]; then
            echo "| PR Number | #${{ steps.check-pr.outputs.pr_number }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ℹ️ PR já existe e está aberta |" >> $GITHUB_STEP_SUMMARY
          fi
