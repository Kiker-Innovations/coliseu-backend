name: Create Release Branch and PR

on:
  workflow_run:
    workflows: ["Deploy Lambda - Homologation"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release Branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Get last version
        id: last_version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)
          echo "last=${LAST_TAG:-v0.0.0}" >> $GITHUB_OUTPUT
          echo "📦 Last version: ${LAST_TAG:-v0.0.0}"

      - name: Determine version bump
        id: bump
        run: |
          COMMITS=$(git log $(git describe --tags --abbrev=0)..HEAD --pretty=%s)

          BUMP="patch"

          if echo "$COMMITS" | grep -q "feat!"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP="minor"
          fi

          echo "type=$BUMP" >> $GITHUB_OUTPUT
          echo "🔼 Version bump: $BUMP"

      - name: Calculate next version
        id: next_version
        run: |
          VERSION=${{ steps.last_version.outputs.last }}
          VERSION=${VERSION#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.type }}" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH+1)) ;;
          esac

          NEXT="v$MAJOR.$MINOR.$PATCH"
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "🚀 Next version: $NEXT"

      - name: Create release branch
        run: |
          git checkout develop
          git checkout -b release/${{ steps.next_version.outputs.version }}
          git push origin release/${{ steps.next_version.outputs.version }}

      - name: Create Pull Request to main
        run: |
          gh pr create \
            --head release/${{ steps.next_version.outputs.version }} \
            --base main \
            --title "🚀 Release ${{ steps.next_version.outputs.version }}" \
            --body "## Release ${{ steps.next_version.outputs.version }}

          Automatic release created after successful homologation deploy.

          **Source:** develop  
          **Target:** main  
          **Version:** ${{ steps.next_version.outputs.version }}

          _This PR was generated automatically._"
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
