name: Deploy Lambda - Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "340593396817"
  ENVIRONMENT: prd
  TF_VERSION: 1.6.0
  ECR_REPOSITORY: coliseu-prd
  LAMBDA_FUNCTION_NAME: coliseu-prd

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/inventories/prd/lambda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::340593396817:role/github-coliseu-infra
          role-session-name: github-actions-deploy-prd
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ============================================================
      # Step 1: Create ECR Repository (if not exists)
      # ============================================================
      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply - ECR Only
        run: |
          terraform apply -auto-approve \
            -target=module.ecr
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID_PRD }}
          TF_VAR_app_base_url: ${{ secrets.APP_BASE_URL_PRD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET_PRD }}
          TF_VAR_mongodb_url: ${{ secrets.MONGODB_URL_PRD }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY_PRD }}

      - name: Get ECR Repository URL
        id: ecr
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "repository_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "📦 ECR Repository: $ECR_URL"

      # ============================================================
      # Step 2: Build and Push Docker Image
      # ============================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/app
          file: ${{ github.workspace }}/app/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.repository_url }}:latest
            ${{ steps.ecr.outputs.repository_url }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Show image info
        run: |
          echo "✅ Image pushed successfully!"
          echo "   Repository: ${{ steps.ecr.outputs.repository_url }}"
          echo "   Tags: latest, ${{ github.sha }}"

      # ============================================================
      # Step 3: Create/Update Lambda with the new image
      # ============================================================
      - name: Terraform Apply - Full Infrastructure
        run: |
          terraform apply -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID_PRD }}
          TF_VAR_app_base_url: ${{ secrets.APP_BASE_URL_PRD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET_PRD }}
          TF_VAR_mongodb_url: ${{ secrets.MONGODB_URL_PRD }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY_PRD }}

      - name: Update Lambda to use new image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.ecr.outputs.repository_url }}:${{ github.sha }}

      - name: Wait for Lambda update
        run: |
          echo "⏳ Waiting for Lambda function update..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
          echo "✅ Lambda function updated successfully!"

      - name: Terraform Outputs
        run: terraform output -no-color
